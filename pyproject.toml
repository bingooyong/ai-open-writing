[project]
name = "novel-agent"
version = "0.1.0"
description = "本地优先的 AI 长篇小说创作智能体(阶段1:CLI + 本地写作台)"
requires-python = ">=3.11"
dependencies = [
    "agentscope==2.0.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlmodel>=0.0.16",
    "alembic>=1.13",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "lancedb>=0.37.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
]

[project.scripts]
novel = "novel_agent.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_agent"]

[tool.uv]
python-preference = "only-system"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # autogenerate 产物不做行宽整形
"src/novel_agent/api/routes.py" = ["B008"]  # FastAPI Depends/Query/Body 默认参数

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "lancedb", "lancedb.*", "pyarrow", "pyarrow.*"]
follow_imports = "skip"
