draft_scenes:
  - scene_id: v1c001_s1
    content: >-
      临安茶楼里灯火通明，苏晚生一拍醒木，满堂皆静。
      他随口编了西市失火的段子，听众叫好。
      散场时巷口有人议论，说西市夜里真的走了水。
      苏晚生心里发冷，第一次觉得评书和现实对上了。
  - scene_id: v1c001_s2
    content: >-
      入夜后他绕到茶楼后巷，霍执事已经等在那里。
      霍执事把已签好的契书收进袖中，苏晚生却想不起自己何时落过笔。
      没有讨价还价，没有拒绝，签约这个结果像从空白处掉下来。
      苏晚生站在原处，因果已经断了。
chapter_summary: 未铺垫的签约结果突然成立
quote: 霍执事把已签好的契书收进袖中，苏晚生却想不起自己何时落过笔
