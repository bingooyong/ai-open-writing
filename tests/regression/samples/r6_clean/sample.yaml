      临安茶楼里灯火通明，苏晚生一拍醒木，满堂皆静。
      他随口编了西市失火的段子，听众叫好。
      散场时巷口有人议论，说西市夜里真的走了水。
      苏晚生心里发冷，第一次觉得评书和现实对上了。
