draft_scenes:
  - scene_id: v1c001_s1
    content: >-
      临安茶楼里灯火通明，苏晚生一拍醒木，满堂皆静。
      他随口编了西市失火的段子，听众叫好。
      散场时巷口忽然一暗，已经身亡的苏晚梅推开茶楼的门走了进来，
      裙摆上还带着未干的烟灰，像是刚从火里走回人世。
      苏晚生手里的醒木掉在桌上，茶客却只当这是新桥段。
  - scene_id: v1c001_s2
    content: >-
      入夜后他绕到茶楼后巷，想把方才的事说成眼花。
      可那女子还站在灯影里叫他哥哥，声音清楚得不像幻觉。
      苏晚生把到嘴边的否认咽了回去，却知道正史已经裂开一道口子。
chapter_summary: 已死的妹妹走进茶楼
