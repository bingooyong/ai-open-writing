draft_scenes:
  - scene_id: v1c001_s1
    content: >-
      临安茶楼里灯火通明，苏晚生一拍醒木，满堂皆静。
      他随口编了西市失火的段子，听众叫好。
      苏晚生心里清楚书局主人其实叫赵无咎，今夜派来收网的人不过是一枚棋子。
      可章纲不许他知道这个名字，他却把它当成了既成事实。
  - scene_id: v1c001_s2
    content: >-
      入夜后他绕到茶楼后巷，霍执事已经等在那里。
      对方不谈天，只问他下一句还讲不讲。
      苏晚生想到妹妹，把到嘴边的故事咽了回去。
